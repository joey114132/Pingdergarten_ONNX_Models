# "nori am" wake word — Piper TTS, English transliteration of 노리암
#
# Piper en-us-libritts-high pronunciation is roughly "NOR-ee am".
# Korean speakers saying 노리암 should trigger reliably.
model_name: nori_arm

target_phrases: ["nori am"]

tts_backend: piper_vits

n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500
tts_batch_size: 50

custom_negative_phrases:
  - "nori"
  - "no harm"
  - "no arm"
  - "no I am"
  - "raise arm"
  - "lift arm"
  - "robot arm"

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

piper_tts:
  checkpoint_relpath: piper/en-us-libritts-high.pt

data_dir: ./data
output_dir: ./output/nori_arm

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  background_paths: [./data/backgrounds]
  rir_paths: [./data/rirs]

model:
  model_type: conv_attention
  model_size: small

steps: 75000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 800
target_fp_per_hour: 0.5

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
